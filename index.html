<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    >
    <title>Red Alert 2 in your browser · ra2.games</title>
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#090914">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ra2.games">
    <link rel="stylesheet" href="/src/ui/pages/game/styles.css">
    <script>
    if (new URLSearchParams(location.search).get('mobile') === '1')
      document.documentElement.classList.add('mobile-initial-enabled');
    </script>
    <style>
    .mobile-initial {
      display: none;
    }
    .mobile-initial-enabled .mobile-initial {
      display: block;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #171a1b url("/images/mobile-loading-background.png") center / cover no-repeat;
      color: #f3e6cd;
      font: 22px system-ui;
    }
    .mobile-initial p {
      position: absolute;
      left: 7vw;
      bottom: 8vh;
    }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="mobile-initial"><p>正在加载游戏…</p></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
